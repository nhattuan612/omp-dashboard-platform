- insert:
    - id: llm-omp-gateway
      name: ./adapter.mjs
      inject: [llm]
      config:
        baseUrl: http://127.0.0.1:4177
        provider: omp-google-pro
        egoProvider: omp-google-pro-ego
        model: gemini-3.8-flash
        cwd: !!js process.cwd()

- id: agent-default-model
  config:
    provider: omp-google-pro
    model: gemini-3.8-flash
